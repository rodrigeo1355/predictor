<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoBet - Análisis Deportivo & Cuotas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1a2e 50%, #16213e 100%); color: #e0e0e0; min-height: 100vh; }

        /* HEADER */
        .header { background: linear-gradient(135deg, #FF6B35 0%, #F77F00 50%, #FCBF49 100%); color: white; text-align: center; padding: 40px 20px; border-bottom: 5px solid #04A777; position: relative; overflow: hidden; box-shadow: 0 8px 32px rgba(255,107,53,0.3); }
        .header::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.05) 10px, rgba(255,255,255,0.05) 20px); }
        .header h1 { font-size: 3.2rem; letter-spacing: 4px; text-transform: uppercase; position: relative; font-weight: 900; text-shadow: 3px 3px 6px rgba(0,0,0,0.3); }
        .header h1 .geo { color: #04A777; }
        .header .date { font-size: 1.1rem; opacity: 0.95; margin-top: 10px; position: relative; font-weight: 600; }
        .header .subtitle { font-size: 0.9rem; color: rgba(255,255,255,0.9); margin-top: 6px; position: relative; letter-spacing: 2px; text-transform: uppercase; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .disclaimer { text-align: center; font-size: 0.75rem; color: #FF6B35; padding: 12px; background: rgba(255,107,53,0.05); border-radius: 8px; margin-bottom: 20px; }

        /* SPORT TABS (level 1 — big) */
        .sport-tabs { display: flex; justify-content: center; margin: 20px auto 0; max-width: 900px; padding: 0 20px; flex-wrap: wrap; gap: 4px; }
        .sport-tab-btn { flex: 1; min-width: 90px; max-width: 180px; padding: 16px 10px; background: linear-gradient(135deg, #141824, #1a1f30); color: #888; border: 2px solid #1e2638; border-bottom: 4px solid transparent; cursor: pointer; font-size: 0.9rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; text-align: center; transition: all 0.3s; border-radius: 12px 12px 0 0; }
        .sport-tab-btn.active { background: linear-gradient(135deg, #FF6B35, #F77F00); color: #fff; border-bottom-color: #04A777; box-shadow: 0 4px 12px rgba(255,107,53,0.3); }
        .sport-tab-btn:hover:not(.active) { color: #ccc; background: linear-gradient(135deg, #1a1f30, #252d3d); border-color: #FF6B35; }
        .sport-tab-icon { font-size: 1.3rem; display: block; margin-bottom: 4px; }

        /* LEAGUE TABS (level 2 — small, only for football) */
        .league-tabs { display: none; justify-content: center; flex-wrap: wrap; gap: 4px; margin: 0 auto; max-width: 900px; padding: 4px 20px 0; background: rgba(255,107,53,0.06); border: 1px solid #1e2638; border-top: none; }
        .league-tabs.visible { display: flex; }
        .league-tab-btn { padding: 9px 14px; background: rgba(255,255,255,0.04); color: #777; border: 1px solid #1e2638; border-bottom: 3px solid transparent; cursor: pointer; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; text-align: center; transition: all 0.25s; border-radius: 0; }
        .league-tab-btn:first-child { border-radius: 0 0 0 0; }
        .league-tab-btn.active { background: rgba(255,107,53,0.15); color: #FCBF49; border-bottom-color: #FF6B35; }
        .league-tab-btn:hover:not(.active) { color: #ccc; background: rgba(255,255,255,0.08); border-color: #FF6B35; }

        /* LEAGUE HEADER */
        .league-header { display: flex; align-items: center; gap: 14px; margin: 32px 0 18px 0; padding: 16px 24px; background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 14px; border-left: 6px solid #FF6B35; box-shadow: 0 4px 12px rgba(255,107,53,0.15); }
        .league-flag { font-size: 1.8rem; }
        .league-name { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #fff; }
        .league-tag { margin-left: auto; font-size: 0.75rem; padding: 6px 14px; border-radius: 20px; background: rgba(255,107,53,0.2); color: #FCBF49; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

        /* TORNEO SUB-HEADER (tenis) */
        .torneo-header { display: flex; align-items: center; gap: 10px; margin: 24px 0 12px 0; padding: 12px 18px; background: rgba(255,255,255,0.04); border-radius: 10px; border-left: 4px solid #FCBF49; }
        .torneo-nombre { font-size: 1rem; font-weight: 800; color: #FCBF49; text-transform: uppercase; letter-spacing: 1px; }
        .torneo-categoria { margin-left: auto; font-size: 0.72rem; color: #888; font-weight: 600; }

        /* MATCH CARD */
        .match-card { background: linear-gradient(135deg, #141824, #1a1f30); border-radius: 14px; margin-bottom: 20px; overflow: hidden; border: 1px solid #1e2638; transition: all 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .match-card:hover { border-color: #FF6B35; box-shadow: 0 6px 20px rgba(255,107,53,0.2); transform: translateY(-2px); }

        .match-time { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px; background: rgba(255,107,53,0.12); font-size: 0.85rem; color: #FF6B35; font-weight: 700; letter-spacing: 1px; }
        .match-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 8px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .match-badge.conditional { background: rgba(255,107,53,0.2); color: #FF6B35; }
        .match-badge.confirmed { background: rgba(4,167,119,0.2); color: #04A777; }
        .match-badge.final { background: rgba(252,191,73,0.2); color: #FCBF49; }
        .match-badge.ronda { background: rgba(108,122,156,0.2); color: #8892b0; }

        .match-teams { display: flex; align-items: center; padding: 16px 20px; gap: 12px; }
        .team { flex: 1; text-align: center; }
        .team-name { font-size: 1rem; font-weight: 800; color: #fff; line-height: 1.3; }
        .team-meta { font-size: 0.72rem; color: #888; margin-top: 5px; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .team-pos { background: rgba(255,107,53,0.15); color: #FCBF49; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
        .team-pts { color: #04A777; font-weight: 600; }
        .vs { font-size: 0.85rem; color: #555; font-weight: bold; flex-shrink: 0; padding: 0 4px; }

        /* PREDICTION SECTION */
        .prediction-section { padding: 14px 18px; border-top: 1px solid #1e2638; }
        .prob-header { font-size: 0.68rem; color: #888; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; font-weight: 700; }

        .prob-row { display: flex; gap: 10px; align-items: stretch; margin-bottom: 14px; }
        .prob-item { flex: 1; }
        .prob-label { font-size: 0.62rem; color: #888; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; font-weight: 600; }
        .prob-bar-wrap { display: flex; align-items: center; gap: 6px; }
        .prob-bar { flex: 1; height: 8px; background: #1e2638; border-radius: 4px; overflow: hidden; }
        .prob-fill { height: 100%; border-radius: 4px; }
        .prob-fill.local  { background: linear-gradient(90deg, #04A777, #00c98c); }
        .prob-fill.draw   { background: linear-gradient(90deg, #6c7a9c, #8892b0); }
        .prob-fill.visit  { background: linear-gradient(90deg, #FF6B35, #F77F00); }
        .prob-fill.j1     { background: linear-gradient(90deg, #04A777, #00c98c); }
        .prob-fill.j2     { background: linear-gradient(90deg, #FF6B35, #F77F00); }
        .prob-pct { font-size: 0.82rem; font-weight: 800; color: #aaa; min-width: 32px; text-align: right; }
        .prob-pct.winner { color: #FCBF49; }

        /* STATS ROW */
        .divider { height: 1px; background: #1e2638; margin: 12px 0; }
        .stats-row { display: flex; gap: 6px; margin-bottom: 14px; }
        .stat-item { flex: 1; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 9px 6px; text-align: center; border: 1px solid #1e2638; }
        .stat-icon { font-size: 1rem; display: block; }
        .stat-label { font-size: 0.58rem; color: #777; text-transform: uppercase; letter-spacing: 1px; display: block; margin: 3px 0 2px; }
        .stat-val { font-size: 0.88rem; font-weight: 800; color: #FCBF49; }

        /* BETSSON ODDS */
        .odds-section { background: rgba(4,167,119,0.06); border: 1px solid rgba(4,167,119,0.2); border-radius: 10px; padding: 10px 12px; }
        .odds-header { font-size: 0.62rem; color: #04A777; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .odds-header::before { content: ''; display: inline-block; width: 6px; height: 6px; background: #04A777; border-radius: 50%; }
        .odds-row { display: flex; gap: 6px; }
        .odd-item { flex: 1; text-align: center; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 4px; border: 1px solid #1e2638; cursor: default; transition: all 0.2s; }
        .odd-item:hover { border-color: #04A777; background: rgba(4,167,119,0.1); }
        .odd-item.highlight { border-color: #FCBF49; background: rgba(252,191,73,0.08); }
        .odd-type { font-size: 0.6rem; color: #777; display: block; margin-bottom: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .odd-val { font-size: 1rem; font-weight: 900; color: #04A777; }
        .odd-item.highlight .odd-val { color: #FCBF49; }

        /* NOTE BOX */
        .match-note { padding: 7px 18px; background: rgba(108,122,156,0.08); border-top: 1px solid #1e2638; font-size: 0.72rem; color: #777; text-align: center; font-style: italic; }

        .stadium { padding: 8px 20px; background: rgba(4,167,119,0.05); border-top: 1px solid #1e2638; font-size: 0.75rem; color: #666; text-align: center; }

        /* NO MATCHES */
        .no-matches { text-align: center; padding: 40px 20px; color: #666; font-size: 0.95rem; }
        .no-matches .info-box { background: rgba(255,107,53,0.05); border: 1px solid rgba(255,107,53,0.15); border-radius: 12px; padding: 20px; margin-top: 16px; font-size: 0.85rem; color: #aaa; }

        /* F1 SECTION */
        .f1-section { margin-top: 16px; }
        .f1-no-race { background: linear-gradient(135deg, #141824, #1a1f30); border-radius: 14px; padding: 28px 24px; text-align: center; border: 1px solid #1e2638; margin-bottom: 20px; }
        .f1-no-race .f1-icon { font-size: 3rem; margin-bottom: 12px; }
        .f1-no-race h3 { font-size: 1.1rem; color: #FF6B35; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
        .f1-no-race p { font-size: 0.85rem; color: #888; }
        .f1-next-race { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 14px; padding: 20px 24px; border: 1px solid rgba(252,191,73,0.3); border-left: 5px solid #FCBF49; margin-bottom: 24px; }
        .f1-next-race h4 { font-size: 0.7rem; color: #FCBF49; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin-bottom: 10px; }
        .f1-next-race .race-name { font-size: 1.2rem; font-weight: 900; color: #fff; margin-bottom: 6px; }
        .f1-next-race .race-circuit { font-size: 0.85rem; color: #aaa; margin-bottom: 10px; }
        .f1-next-race .race-dates { display: flex; gap: 12px; flex-wrap: wrap; }
        .f1-next-race .race-date-item { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 14px; font-size: 0.8rem; color: #ccc; border: 1px solid #1e2638; }
        .f1-next-race .race-date-item strong { color: #FCBF49; display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }

        .f1-standings-title { font-size: 0.75rem; color: #FF6B35; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin: 20px 0 10px 0; display: flex; align-items: center; gap: 8px; }
        .f1-standings-title::before { content: ''; display: inline-block; width: 4px; height: 16px; background: #FF6B35; border-radius: 2px; }
        .f1-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .f1-table th { background: rgba(255,107,53,0.1); color: #FF6B35; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; padding: 8px 10px; text-align: left; font-weight: 700; border-bottom: 1px solid #1e2638; }
        .f1-table td { padding: 9px 10px; font-size: 0.83rem; border-bottom: 1px solid #1e2638; color: #ccc; vertical-align: middle; }
        .f1-table tr:last-child td { border-bottom: none; }
        .f1-table tr:hover td { background: rgba(255,255,255,0.03); }
        .f1-table .pos-col { color: #FCBF49; font-weight: 900; font-size: 0.95rem; }
        .f1-table .pts-col { color: #04A777; font-weight: 800; }
        .f1-pts-bar { height: 5px; background: #1e2638; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .f1-pts-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #04A777, #00c98c); }
        .constructor-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }

        /* PICKS SECTION */
        .picks-summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .picks-stat { flex: 1; min-width: 80px; background: linear-gradient(135deg, #141824, #1a1f30); border-radius: 12px; padding: 14px 10px; text-align: center; border: 1px solid #1e2638; }
        .picks-stat .ps-val { font-size: 1.8rem; font-weight: 900; color: #FCBF49; display: block; }
        .picks-stat .ps-label { font-size: 0.62rem; color: #777; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .picks-table-wrap { overflow-x: auto; }
        .picks-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .picks-table th { background: rgba(255,107,53,0.1); color: #FF6B35; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; padding: 10px 12px; text-align: left; font-weight: 700; border-bottom: 2px solid rgba(255,107,53,0.2); white-space: nowrap; }
        .picks-table td { padding: 10px 12px; border-bottom: 1px solid #1e2638; color: #ccc; vertical-align: middle; }
        .picks-table tr:last-child td { border-bottom: none; }
        .picks-table tr:hover td { background: rgba(255,255,255,0.03); }
        .picks-table .pick-name { color: #04A777; font-weight: 800; }
        .picks-table .prob-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; background: rgba(252,191,73,0.1); color: #FCBF49; font-weight: 800; font-size: 0.78rem; }
        .picks-table .cuota-val { color: #aaa; font-weight: 700; }
        .picks-result.pendiente { color: #666; font-style: italic; }
        .picks-result.correcto { color: #04A777; font-weight: 800; }
        .picks-result.incorrecto { color: #FF6B35; font-weight: 800; }
        .picks-note { margin-top: 16px; padding: 12px 16px; background: rgba(108,122,156,0.08); border-radius: 10px; font-size: 0.75rem; color: #666; text-align: center; font-style: italic; border: 1px solid #1e2638; }

        .footer { text-align: center; padding: 24px; color: #555; font-size: 0.78rem; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <h1><span class="geo">GEO</span><span class="bet">BET</span></h1>
        <div class="date" id="headerDate"></div>
        <div class="subtitle">Análisis Deportivo & Cuotas en Vivo</div>
    </div>

    <div class="container">
        <div class="disclaimer">
            ⚠️ Predicciones basadas en tabla de posiciones y rankings. No garantizan resultado. Cuotas Betsson Chile referenciales.
        </div>

        <!-- Level 1: Sport tabs -->
        <div class="sport-tabs" id="sportTabsContainer"></div>

        <!-- Level 2: League tabs (only football) -->
        <div class="league-tabs" id="leagueTabsContainer"></div>

        <div id="contentContainer"></div>

        <div class="footer">
            🌍 <strong>GeoBet</strong> © 2026 — Análisis & Cuotas en Vivo<br>
            📊 Datos: ESPN · Betsson Chile · ATP/WTA Tours · NBA.com | Actualizado: <span id="updateDate"></span>
        </div>
    </div>

    <script>
    let matchData = {};
    let currentSport = null;
    let currentLeague = null;

    async function loadData() {
        try {
            const r = await fetch('data.json');
            matchData = await r.json();
            initUI();
        } catch (e) {
            document.getElementById('contentContainer').innerHTML = '<div style="text-align:center;padding:40px;color:#FF6B35">Error cargando datos</div>';
        }
    }

    function initUI() {
        document.getElementById('headerDate').textContent = matchData.fin_de_semana || '';
        document.getElementById('updateDate').textContent = matchData.fecha_generacion || '';
        buildSportTabs();
        selectSport('futbol');
    }

    /* ─── SPORT TABS ─── */
    function buildSportTabs() {
        const c = document.getElementById('sportTabsContainer');
        c.innerHTML = '';
        Object.entries(matchData.deportes || {}).forEach(([key, sport]) => {
            const btn = document.createElement('button');
            btn.className = 'sport-tab-btn';
            btn.id = 'sport-btn-' + key;
            btn.innerHTML = `<span class="sport-tab-icon">${sport.icono || ''}</span>${sport.nombre || key}`;
            btn.onclick = () => selectSport(key, btn);
            c.appendChild(btn);
        });
    }

    function selectSport(sportKey, btnEl) {
        currentSport = sportKey;
        document.querySelectorAll('.sport-tab-btn').forEach(b => b.classList.remove('active'));
        const btn = btnEl || document.getElementById('sport-btn-' + sportKey);
        if (btn) btn.classList.add('active');

        const leagueTabs = document.getElementById('leagueTabsContainer');
        if (sportKey === 'futbol') {
            leagueTabs.classList.add('visible');
            buildLeagueTabs(sportKey);
            selectLeague('chile');
        } else {
            leagueTabs.classList.remove('visible');
            const sport = matchData.deportes[sportKey];
            if (sport && sport.ligas) {
                const firstLeagueKey = Object.keys(sport.ligas)[0];
                if (firstLeagueKey) renderLeagueContent(sportKey, firstLeagueKey);
            }
        }
    }

    /* ─── LEAGUE TABS (football only) ─── */
    function buildLeagueTabs(sportKey) {
        const c = document.getElementById('leagueTabsContainer');
        c.innerHTML = '';
        const sport = matchData.deportes[sportKey];
        if (!sport || !sport.ligas) return;
        Object.keys(sport.ligas).forEach(key => {
            const btn = document.createElement('button');
            btn.className = 'league-tab-btn';
            btn.id = 'league-btn-' + key;
            btn.textContent = getLeagueTabName(key);
            btn.onclick = () => selectLeague(key, btn);
            c.appendChild(btn);
        });
    }

    function selectLeague(leagueKey, btnEl) {
        currentLeague = leagueKey;
        document.querySelectorAll('.league-tab-btn').forEach(b => b.classList.remove('active'));
        const btn = btnEl || document.getElementById('league-btn-' + leagueKey);
        if (btn) btn.classList.add('active');
        renderLeagueContent(currentSport, leagueKey);
    }

    /* ─── RENDER CONTENT ─── */
    function renderLeagueContent(sportKey, leagueKey) {
        const sport = matchData.deportes[sportKey];
        if (!sport) return;
        const league = sport.ligas[leagueKey];
        if (!league) return;

        const el = document.getElementById('contentContainer');
        const flag = getLeagueFlag(leagueKey);
        const jornada = league.jornada || league.ronda || league.competicion || league.periodo || '';

        let html = `<div class="league-header">
            <span class="league-flag">${flag}</span>
            <span class="league-name">${league.nombre || leagueKey.replace(/_/g,' ')}</span>
            <span class="league-tag">${jornada}</span>
        </div>`;

        if (league.tipo === 'formula1') {
            html += renderF1(league);
        } else if (league.tipo === 'picks') {
            html += renderPicks(league);
        } else if (league.tipo === 'tenis') {
            html += renderTennisSection(league);
        } else if (league.tipo === 'baloncesto') {
            if (!league.partidos || league.partidos.length === 0) {
                const info = league.nota_importante || league.nota || 'Sin partidos confirmados.';
                html += `<div class="no-matches"><div style="font-size:2rem;margin-bottom:12px">📭</div>Sin partidos este fin de semana<div class="info-box">ℹ️ ${info}</div></div>`;
            } else {
                league.partidos.forEach(m => html += renderNBACard(m));
            }
        } else {
            if (!league.partidos || league.partidos.length === 0) {
                const info = league.dato_destacado || league.nota || 'Sin partidos confirmados para esta fecha.';
                html += `<div class="no-matches"><div style="font-size:2rem;margin-bottom:12px">📭</div>Sin partidos este fin de semana<div class="info-box">ℹ️ ${info}</div></div>`;
            } else {
                league.partidos.forEach(m => html += renderFootballCard(m));
            }
        }

        el.innerHTML = html;
    }

    /* ─── F1 RENDERER ─── */
    function renderF1(league) {
        let html = '<div class="f1-section">';

        if (league.status && league.status.includes('SIN CARRERA')) {
            html += `<div class="f1-no-race">
                <div class="f1-icon">🏎️</div>
                <h3>Sin carrera este fin de semana</h3>
                <p>${league.nota || ''}</p>
            </div>`;
        }

        if (league.proxima_carrera) {
            const pc = league.proxima_carrera;
            html += `<div class="f1-next-race">
                <h4>🏁 Próxima Carrera</h4>
                <div class="race-name">${pc.nombre}</div>
                <div class="race-circuit">📍 ${pc.circuito}</div>
                <div class="race-dates">
                    <div class="race-date-item"><strong>Fecha</strong>${pc.fecha}</div>
                    <div class="race-date-item"><strong>Clasificación</strong>${pc.clasificacion}</div>
                    <div class="race-date-item"><strong>Carrera</strong>${pc.carrera}</div>
                </div>
            </div>`;
        }

        if (league.campeonato_pilotos && league.campeonato_pilotos.length) {
            const maxPts = league.campeonato_pilotos[0].pts;
            html += `<div class="f1-standings-title">Campeonato de Pilotos</div>
            <table class="f1-table">
                <thead><tr><th>Pos</th><th>Piloto</th><th>Equipo</th><th>Pts</th></tr></thead>
                <tbody>`;
            league.campeonato_pilotos.forEach(p => {
                const pct = Math.round((p.pts / maxPts) * 100);
                html += `<tr>
                    <td class="pos-col">${p.pos}</td>
                    <td>${p.bandera} ${p.piloto}</td>
                    <td>${p.equipo}</td>
                    <td class="pts-col">
                        ${p.pts}
                        <div class="f1-pts-bar"><div class="f1-pts-fill" style="width:${pct}%"></div></div>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
        }

        if (league.campeonato_constructores && league.campeonato_constructores.length) {
            const maxPts = league.campeonato_constructores[0].pts;
            html += `<div class="f1-standings-title">Campeonato de Constructores</div>
            <table class="f1-table">
                <thead><tr><th>Pos</th><th>Constructor</th><th>Pts</th></tr></thead>
                <tbody>`;
            league.campeonato_constructores.forEach(c => {
                const pct = Math.round((c.pts / maxPts) * 100);
                html += `<tr>
                    <td class="pos-col">${c.pos}</td>
                    <td><span class="constructor-dot" style="background:${c.color}"></span>${c.equipo}</td>
                    <td class="pts-col">
                        ${c.pts}
                        <div class="f1-pts-bar"><div class="f1-pts-fill" style="width:${pct}%;background:${c.color}"></div></div>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
        }

        html += '</div>';
        return html;
    }

    /* ─── PICKS RENDERER ─── */
    function renderPicks(league) {
        const res = league.resumen || {};
        const picks = league.picks_list || [];

        let html = `<div class="picks-summary">
            <div class="picks-stat"><span class="ps-val">${res.total || 0}</span><span class="ps-label">Total</span></div>
            <div class="picks-stat"><span class="ps-val" style="color:#04A777">${res.correctas || 0}</span><span class="ps-label">Correctas</span></div>
            <div class="picks-stat"><span class="ps-val" style="color:#666">${res.pendientes || 0}</span><span class="ps-label">Pendientes</span></div>
            <div class="picks-stat"><span class="ps-val" style="color:#FCBF49">${res.precision_pct || 0}%</span><span class="ps-label">Precisión</span></div>
        </div>`;

        html += `<div class="picks-table-wrap"><table class="picks-table">
            <thead><tr><th>Deporte</th><th>Partido</th><th>Pick</th><th>Prob%</th><th>Cuota</th><th>Fecha</th><th>Resultado</th></tr></thead>
            <tbody>`;

        picks.forEach(p => {
            const resCls = p.resultado === 'correcto' ? 'correcto' : p.resultado === 'incorrecto' ? 'incorrecto' : 'pendiente';
            const resLabel = p.resultado === 'correcto' ? '✅ Correcto' : p.resultado === 'incorrecto' ? '❌ Incorrecto' : '— pendiente';
            html += `<tr>
                <td>${p.deporte}</td>
                <td>${p.partido}</td>
                <td class="pick-name">${p.pick}</td>
                <td><span class="prob-badge">${p.prob_pct}%</span></td>
                <td class="cuota-val">${p.cuota.toFixed(2)}</td>
                <td>${p.fecha}</td>
                <td class="picks-result ${resCls}">${resLabel}</td>
            </tr>`;
        });

        html += `</tbody></table></div>
        <div class="picks-note">
            📌 Picks seleccionados con probabilidad &gt;54% y cuota &gt;1.10. Metodología: posiciones, forma reciente, historial h2h y factores externos.
        </div>`;

        return html;
    }

    /* ─── FOOTBALL CARD ─── */
    function renderFootballCard(m) {
        const hora = m.hora_chile_clt || 'TBD';
        const fp = m.fecha_partido ? ` · ${m.fecha_partido}` : '';
        const p = m.prediccion;
        if (!p) return simpleCard(m, hora, fp);

        const maxP = Math.max(p.prob_local, p.prob_empate, p.prob_visitante);
        const hl = p.favorito === 'local' ? 'local' : p.favorito === 'visitante' ? 'visitante' : 'empate';

        return `<div class="match-card">
            <div class="match-time">⏰ ${hora} CLT${fp}</div>
            <div class="match-teams">
                <div class="team">
                    <div class="team-name">${m.local}</div>
                    <div class="team-meta"><span class="team-pos">${p.pos_local}°</span><span class="team-pts">${p.pts_local} pts</span></div>
                </div>
                <div class="vs">VS</div>
                <div class="team">
                    <div class="team-name">${m.visitante}</div>
                    <div class="team-meta"><span class="team-pos">${p.pos_visitante}°</span><span class="team-pts">${p.pts_visitante} pts</span></div>
                </div>
            </div>
            <div class="prediction-section">
                <div class="prob-header">📊 Probabilidades de victoria</div>
                <div class="prob-row">
                    ${probBar('Local', 'local', p.prob_local, p.prob_local === maxP)}
                    ${probBar('Empate', 'draw', p.prob_empate, p.prob_empate === maxP && p.favorito === 'empate')}
                    ${probBar('Visita', 'visit', p.prob_visitante, p.prob_visitante === maxP)}
                </div>
                <div class="divider"></div>
                <div class="stats-row">
                    ${statBox('⚽','Goles',p.goles_esperados)}
                    ${statBox('🟨','Tarjetas',p.tarjetas_esperadas)}
                    ${statBox('📐','Corners',p.corners_esperados)}
                </div>
                <div class="divider"></div>
                ${oddsSection3way(m.local, m.visitante, p.cuotas_betsson, hl)}
            </div>
            ${m.nota ? `<div class="match-note">📌 ${m.nota}</div>` : ''}
            ${m.estadio ? `<div class="stadium">🏟️ ${m.estadio}</div>` : ''}
        </div>`;
    }

    function simpleCard(m, hora, fp) {
        return `<div class="match-card">
            <div class="match-time">⏰ ${hora} CLT${fp}</div>
            <div class="match-teams">
                <div class="team"><div class="team-name">${m.local}</div></div>
                <div class="vs">VS</div>
                <div class="team"><div class="team-name">${m.visitante}</div></div>
            </div>
            ${m.estadio ? `<div class="stadium">🏟️ ${m.estadio}</div>` : ''}
        </div>`;
    }

    /* ─── NBA CARD ─── */
    function renderNBACard(m) {
        const hora = m.hora_chile_clt || 'TBD';
        const p = m.prediccion_nba;
        const badge = m.condicional
            ? `<span class="match-badge conditional">CONDICIONAL</span>`
            : `<span class="match-badge confirmed">CONFIRMADO</span>`;

        if (!p) return `<div class="match-card">
            <div class="match-time">🏀 ${hora} CLT ${badge}</div>
            <div class="match-teams">
                <div class="team"><div class="team-name">${m.local}</div><div class="team-meta">${m.serie||''}</div></div>
                <div class="vs">VS</div>
                <div class="team"><div class="team-name">${m.visitante}</div><div class="team-meta">${m.estado_serie||''}</div></div>
            </div>
            <div class="stadium">🏟️ ${m.estadio} · ${m.tipo_partido}</div>
        </div>`;

        const maxP = Math.max(p.prob_local, p.prob_visitante);
        const hl = p.favorito === 'local' ? 'local' : 'visitante';

        return `<div class="match-card">
            <div class="match-time">🏀 ${hora} CLT ${badge}</div>
            <div class="match-teams">
                <div class="team">
                    <div class="team-name">${m.local}</div>
                    <div class="team-meta">
                        <span class="team-pos">#${p.seed_local} seed</span>
                        <span class="team-pts">${p.record_local}</span>
                    </div>
                </div>
                <div class="vs">VS</div>
                <div class="team">
                    <div class="team-name">${m.visitante}</div>
                    <div class="team-meta">
                        <span class="team-pos">#${p.seed_visitante} seed</span>
                        <span class="team-pts">${p.record_visitante}</span>
                    </div>
                </div>
            </div>
            <div class="prediction-section">
                <div class="prob-header">📊 Probabilidades de victoria · ${m.serie} · ${m.estado_serie}</div>
                <div class="prob-row">
                    ${probBar(m.local.split(' ').slice(-1)[0], 'local', p.prob_local, p.prob_local === maxP)}
                    ${probBar(m.visitante.split(' ').slice(-1)[0], 'visit', p.prob_visitante, p.prob_visitante === maxP)}
                </div>
                <div class="divider"></div>
                <div class="stats-row">
                    ${statBox('🏀','Total pts',p.total_pts_esperados)}
                    ${statBox('📊','Spread',p.spread)}
                    ${statBox('🎯','Serie',m.estado_serie.split('(')[0].trim())}
                </div>
                <div class="divider"></div>
                <div class="odds-section">
                    <div class="odds-header">Cuotas Betsson Chile — Moneyline</div>
                    <div class="odds-row">
                        <div class="odd-item ${hl==='local'?'highlight':''}">
                            <span class="odd-type">${m.local}</span>
                            <span class="odd-val">${p.cuotas_betsson.local.toFixed(2)}</span>
                        </div>
                        <div class="odd-item ${hl==='visitante'?'highlight':''}">
                            <span class="odd-type">${m.visitante}</span>
                            <span class="odd-val">${p.cuotas_betsson.visitante.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="stadium">🏟️ ${m.estadio} · ${m.tipo_partido}</div>
        </div>`;
    }

    /* ─── TENNIS SECTION ─── */
    function renderTennisSection(league) {
        const groups = {};
        league.partidos.forEach(m => {
            const k = m.torneo || 'Otros';
            if (!groups[k]) groups[k] = { categoria: m.categoria, partidos: [] };
            groups[k].partidos.push(m);
        });

        let html = '';
        for (const [nombre, g] of Object.entries(groups)) {
            html += `<div class="torneo-header">
                <span class="torneo-nombre">🏆 ${nombre}</span>
                <span class="torneo-categoria">${g.categoria}</span>
            </div>`;
            g.partidos.forEach(m => html += renderTennisCard(m));
        }
        return html;
    }

    function renderTennisCard(m) {
        const hora = m.hora_chile_clt || 'TBD';
        const fp = m.fecha_partido ? ` · ${m.fecha_partido}` : '';
        const p = m.prediccion_tenis;

        const isFinal = m.tipo_match && m.tipo_match.includes('FINAL');
        const badgeClass = isFinal ? 'final' : 'ronda';
        const badge = `<span class="match-badge ${badgeClass}">${m.tipo_match}</span>`;

        if (!p) return `<div class="match-card">
            <div class="match-time">🎾 ${hora} CLT${fp} ${badge}</div>
            <div class="match-teams">
                <div class="team"><div class="team-name">${m.pais1||''} ${m.jugador1}</div></div>
                <div class="vs">VS</div>
                <div class="team"><div class="team-name">${m.pais2||''} ${m.jugador2}</div></div>
            </div>
        </div>`;

        const hl = p.favorito === 'j1' ? 'j1' : 'j2';

        return `<div class="match-card">
            <div class="match-time">🎾 ${hora} CLT${fp} ${badge}</div>
            <div class="match-teams">
                <div class="team">
                    <div class="team-name">${m.pais1||''} ${m.jugador1}</div>
                    <div class="team-meta"><span class="team-pos">${m.ranking1}</span></div>
                </div>
                <div class="vs">VS</div>
                <div class="team">
                    <div class="team-name">${m.pais2||''} ${m.jugador2}</div>
                    <div class="team-meta"><span class="team-pos">${m.ranking2}</span></div>
                </div>
            </div>
            <div class="prediction-section">
                <div class="prob-header">📊 Probabilidades de victoria</div>
                <div class="prob-row">
                    ${probBar(m.jugador1.split(' ').slice(-1)[0], 'j1', p.prob_j1, p.prob_j1 > p.prob_j2)}
                    ${probBar(m.jugador2.split(' ').slice(-1)[0], 'j2', p.prob_j2, p.prob_j2 > p.prob_j1)}
                </div>
                <div class="divider"></div>
                <div class="stats-row">
                    ${statBox('🎾','Sets',p.sets_esperados)}
                    ${statBox('🔢','Games',p.total_games)}
                    ${statBox('💨','Aces',p.aces_esperados)}
                </div>
                <div class="divider"></div>
                <div class="odds-section">
                    <div class="odds-header">Cuotas Betsson Chile — Moneyline</div>
                    <div class="odds-row">
                        <div class="odd-item ${hl==='j1'?'highlight':''}">
                            <span class="odd-type">${m.jugador1}</span>
                            <span class="odd-val">${p.cuotas_betsson.j1.toFixed(2)}</span>
                        </div>
                        <div class="odd-item ${hl==='j2'?'highlight':''}">
                            <span class="odd-type">${m.jugador2}</span>
                            <span class="odd-val">${p.cuotas_betsson.j2.toFixed(2)}</span>
                        </div>
                    </div>
                </div>
            </div>
            ${m.nota ? `<div class="match-note">📌 ${m.nota}</div>` : ''}
            <div class="stadium">🏟️ ${m.estadio}</div>
        </div>`;
    }

    /* ─── HELPERS ─── */
    function getLeagueFlag(key) {
        return {
            chile: '🇨🇱',
            laliga_ea_sports: '🇪🇸',
            serie_a: '🇮🇹',
            bundesliga: '🇩🇪',
            campeonato_brasileño: '🇧🇷',
            campeonato_brasileiro: '🇧🇷',
            copa_do_brasil: '🇧🇷',
            premier_league: '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
            championship: '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
            nba_playoffs: '🏀',
            tenis: '🎾',
            formula1: '🏎️',
            picks: '📊'
        }[key] || '⚽';
    }

    function getLeagueTabName(key) {
        return {
            chile: 'Chile',
            laliga_ea_sports: 'LaLiga',
            bundesliga: 'Bundesliga',
            premier_league: 'Premier',
            serie_a: 'Serie A',
            championship: 'Champ.',
            campeonato_brasileño: 'Brasil',
            campeonato_brasileiro: 'Brasil',
            copa_do_brasil: 'Copa BR',
            nba_playoffs: 'NBA',
            tenis: 'Tenis',
            formula1: 'F1',
            picks: 'Picks'
        }[key] || key.replace(/_/g,' ');
    }

    function probBar(label, cls, pct, isWinner) {
        return `<div class="prob-item">
            <span class="prob-label">${label}</span>
            <div class="prob-bar-wrap">
                <div class="prob-bar"><div class="prob-fill ${cls}" style="width:${pct}%"></div></div>
                <span class="prob-pct ${isWinner?'winner':''}">${pct}%</span>
            </div>
        </div>`;
    }

    function statBox(icon, label, val) {
        return `<div class="stat-item">
            <span class="stat-icon">${icon}</span>
            <span class="stat-label">${label}</span>
            <span class="stat-val">${val}</span>
        </div>`;
    }

    function oddsSection3way(local, visitante, odds, hl) {
        return `<div class="odds-section">
            <div class="odds-header">Cuotas Betsson Chile</div>
            <div class="odds-row">
                <div class="odd-item ${hl==='local'?'highlight':''}">
                    <span class="odd-type">1 Local</span>
                    <span class="odd-val">${odds.local.toFixed(2)}</span>
                </div>
                <div class="odd-item ${hl==='empate'?'highlight':''}">
                    <span class="odd-type">X Empate</span>
                    <span class="odd-val">${odds.empate.toFixed(2)}</span>
                </div>
                <div class="odd-item ${hl==='visitante'?'highlight':''}">
                    <span class="odd-type">2 Visita</span>
                    <span class="odd-val">${odds.visitante.toFixed(2)}</span>
                </div>
            </div>
        </div>`;
    }

    setInterval(loadData, 60000);
    loadData();
    </script>
</body>
</html>
