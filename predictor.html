<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoBet - Análisis Deportivo & Cuotas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e17 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* HEADER - GEOBET BRAND */
        .header {
            background: linear-gradient(135deg, #FF6B35 0%, #F77F00 50%, #FCBF49 100%);
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-bottom: 5px solid #04A777;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3);
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.05) 10px,
                rgba(255,255,255,0.05) 20px
            );
        }
        .header h1 {
            font-size: 3.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            position: relative;
            font-weight: 900;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }
        .header h1 .geo { color: #04A777; font-weight: 900; }
        .header h1 .bet { color: #fff; }
        .header .date {
            font-size: 1.1rem;
            opacity: 0.95;
            margin-top: 10px;
            position: relative;
            font-weight: 600;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.9);
            margin-top: 6px;
            position: relative;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .disclaimer {
            text-align: center;
            font-size: 0.75rem;
            color: #FF6B35;
            padding: 12px;
            border-bottom: 1px solid #1a1a2e;
            background: rgba(255, 107, 53, 0.05);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* TABS */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 0;
            margin: 20px auto 0;
            max-width: 900px;
            padding: 0 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            max-width: 240px;
            padding: 16px 20px;
            background: linear-gradient(135deg, #141824, #1a1f30);
            color: #888;
            border: 2px solid #1e2638;
            border-bottom: 4px solid transparent;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            transition: all 0.3s;
        }
        .tab-btn:first-child { border-radius: 12px 0 0 0; }
        .tab-btn:last-child { border-radius: 0 12px 0 0; }
        .tab-btn.active {
            background: linear-gradient(135deg, #FF6B35, #F77F00);
            color: #fff;
            border-bottom-color: #04A777;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }
        .tab-btn:hover:not(.active) {
            color: #ccc;
            background: linear-gradient(135deg, #1a1f30, #252d3d);
            border-color: #FF6B35;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* LEAGUE HEADER */
        .league-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 32px 0 18px 0;
            padding: 16px 24px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 14px;
            border-left: 6px solid #FF6B35;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.15);
        }
        .league-flag { font-size: 1.8rem; }
        .league-name {
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }
        .league-tag {
            margin-left: auto;
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 107, 53, 0.2);
            color: #FCBF49;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* MATCH CARD */
        .match-card {
            background: linear-gradient(135deg, #141824, #1a1f30);
            border-radius: 14px;
            margin-bottom: 16px;
            overflow: hidden;
            border: 1px solid #1e2638;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .match-card:hover {
            border-color: #FF6B35;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.2);
            transform: translateY(-2px);
        }

        .match-time {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: rgba(255, 107, 53, 0.12);
            font-size: 0.85rem;
            color: #FF6B35;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .match-teams {
            display: flex;
            align-items: center;
            padding: 18px 22px;
            gap: 14px;
        }
        .team {
            flex: 1;
            text-align: center;
        }
        .team-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }
        .team-pos {
            font-size: 0.75rem;
            color: #888;
            margin-top: 3px;
        }
        .vs {
            font-size: 0.9rem;
            color: #666;
            font-weight: bold;
            flex-shrink: 0;
        }

        .stadium {
            padding: 8px 22px;
            background: rgba(4, 167, 119, 0.08);
            border-top: 1px solid #1e2638;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 24px;
            color: #666;
            font-size: 0.8rem;
            margin-top: 40px;
        }

        .no-matches {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 0.95rem;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #FF6B35;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><span class="geo">GEO</span><span class="bet">BET</span></h1>
        <div class="date" id="headerDate"></div>
        <div class="subtitle">Análisis Deportivo & Cuotas en Vivo</div>
    </div>

    <div class="container">
        <div class="disclaimer">
            ⚠️ Las predicciones son estimadas. Úsalas como referencia, no como garantía. El resultado final siempre depende del desempeño en cancha.
        </div>

        <div class="tabs" id="tabsContainer"></div>

        <div id="contentContainer"></div>

        <div class="footer" id="footer">
            🌍 <strong>GeoBet</strong> © 2026 — Análisis & Cuotas en Vivo<br>
            📊 Datos: ESPN, DraftKings, ATP Tour, NBA.com | Actualizado: <span id="updateDate"></span>
        </div>
    </div>

    <script>
        let matchData = {};
        let currentTab = null;

        // Cargar datos desde JSON
        async function loadData() {
            try {
                const response = await fetch('data.json');
                matchData = await response.json();
                initializeUI();
            } catch (error) {
                console.error('Error cargando datos:', error);
                document.getElementById('contentContainer').innerHTML = '<div class="loading">Error cargando datos</div>';
            }
        }

        function initializeUI() {
            setHeaderInfo();
            createTabs();
            selectFirstTab();
        }

        function setHeaderInfo() {
            const date = matchData.fin_de_semana || matchData.fecha || 'Análisis Deportivo';
            document.getElementById('headerDate').textContent = date;
            document.getElementById('updateDate').textContent = matchData.fecha_generacion || new Date().toLocaleDateString();
        }

        function createTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = '';

            Object.keys(matchData.ligas || {}).forEach((leagueKey, index) => {
                const league = matchData.ligas[leagueKey];
                const tabName = getTabName(leagueKey);

                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.textContent = tabName;
                btn.onclick = () => switchTab(leagueKey);
                tabsContainer.appendChild(btn);
            });
        }

        function getTabName(key) {
            const names = {
                'laliga_ea_sports': 'LaLiga',
                'serie_a': 'Serie A',
                'bundesliga': 'Bundesliga',
                'campeonato_brasileiro': 'Campeonato BR',
                'copa_do_brasil': 'Copa Brasil',
                'premier_league': 'Premier',
                'championship': 'Championship',
                'nba_playoffs': 'NBA'
            };
            return names[key] || key.replace(/_/g, ' ');
        }

        function switchTab(leagueKey) {
            currentTab = leagueKey;

            // Update button styles
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            renderContent(leagueKey);
        }

        function selectFirstTab() {
            const firstKey = Object.keys(matchData.ligas || {})[0];
            if (firstKey) {
                currentTab = firstKey;
                document.querySelector('.tab-btn').classList.add('active');
                renderContent(firstKey);
            }
        }

        function renderContent(leagueKey) {
            const league = matchData.ligas[leagueKey];
            const contentContainer = document.getElementById('contentContainer');

            if (!league || !league.partidos || league.partidos.length === 0) {
                contentContainer.innerHTML = `<div class="no-matches">⚽ Sin partidos confirmados para esta fecha</div>`;
                return;
            }

            let html = '';

            // League header
            const flag = getLeagueFlag(leagueKey);
            const jornada = league.jornada || league.fase || 'Jornada';

            html += `
                <div class="league-header">
                    <span class="league-flag">${flag}</span>
                    <span class="league-name">${league.nombre || getTabName(leagueKey)}</span>
                    <span class="league-tag">${jornada}</span>
                </div>
            `;

            // Match cards
            league.partidos.forEach(match => {
                const hora = match.hora_chile_clt || match.hora || 'TBD';
                html += `
                    <div class="match-card">
                        <div class="match-time">⏰ ${hora} CLT</div>
                        <div class="match-teams">
                            <div class="team">
                                <div class="team-name">${match.local || match.equipoLocal}</div>
                            </div>
                            <div class="vs">VS</div>
                            <div class="team">
                                <div class="team-name">${match.visitante || match.equipoVisitante}</div>
                            </div>
                        </div>
                        ${match.estadio ? `<div class="stadium">🏟️ ${match.estadio}</div>` : ''}
                    </div>
                `;
            });

            contentContainer.innerHTML = html;
        }

        function getLeagueFlag(key) {
            const flags = {
                'laliga_ea_sports': '🇪🇸',
                'serie_a': '🇮🇹',
                'bundesliga': '🇩🇪',
                'campeonato_brasileiro': '🇧🇷',
                'copa_do_brasil': '🇧🇷',
                'premier_league': '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
                'championship': '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
                'nba_playoffs': '🏀'
            };
            return flags[key] || '⚽';
        }

        // Auto-reload data cada 60 segundos
        setInterval(loadData, 60000);

        // Cargar datos al iniciar
        loadData();
    </script>

</body>
</html>
